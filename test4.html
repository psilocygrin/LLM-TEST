const SEP_STRENGTH = 4.0; // soft repulsion between frogs

// ═══════════════════════════════════════════════
const C = {
  bg: 0x0b0b20,
  water: 0x00e5ff,
  frog: 0x00ff66,
  frogDark: 0x00b347,
  belly: 0xaaffcc,
  eye: 0xffff00,
  pupil: 0x111111,
  tongue: 0xff3366,
  sun: 0xffcc00,
  sunGlow: 0xff9900,
  moon: 0xc8d8ff,
  moonGlow: 0x8899cc,
  log: 0x6d4c41,
  logDark: 0x4e342e,
  logRing: 0x3e2723,
  grass: 0x00e676,
  lily: 0x1de9b6,
  flower: 0xff4081,

  fly: 0xffeb3b,
  wing: 0xffffff,
  firefly: 0x76ff03,
  moth: 0xbcaaa4,
  mothW: 0xd7ccc8,
  bfly: 0xff5722,
  ripple: 0x84ffff,
  cloud: 0x3a3a6a,

// ═══════════════════════════════════════════════
//  SCENE / CAMERA / RENDERER
// ═══════════════════════════════════════════════
const scene = new THREE.Scene();
scene.background = new THREE.Color(C.bg);
scene.fog = new THREE.Fog(C.bg, 40, 110);

const cam = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 250);

document.body.appendChild(renderer.domElement);

// ═══════════════════════════════════════════════
scene.add(new THREE.AmbientLight(0x334466, 1.2));

const key = new THREE.DirectionalLight(C.sun, 1.0);

// ═══════════════════════════════════════════════
//  MATERIALS
// ═══════════════════════════════════════════════
const M = {

  eye:     new THREE.MeshStandardMaterial({ color: C.eye, roughness: 0.1, emissive: C.eye, emissiveIntensity: 0.4 }),
  pupil:   new THREE.MeshBasicMaterial({ color: C.pupil }),

// ═══════════════════════════════════════════════

// Grass

// ═══════════════════════════════════════════════

const rainGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.8, 4);

let raining = false;
let rainTimer = 0;
const RAIN_CYCLE = 14;

// ═══════════════════════════════════════════════
//  FROG BUILDER
// ═══════════════════════════════════════════════
function buildFrog() {
  const g = new THREE.Group();

  const body = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 20), M.frog);
  body.scale.set(1.1, 0.85, 1.0);
  body.castShadow = true;
  g.add(body);

  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.7, 16, 12), M.belly);
  belly.scale.set(0.9, 0.55, 0.65);
  belly.position.set(0, -0.2, 0.3);
  g.add(belly);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.8, 24, 20), M.frog);
  head.scale.set(1.1, 0.95, 1.0);
  head.position.set(0, 0.55, 0.4);
  head.castShadow = true;
  g.add(head);

  // Eyes
  const eyeGeo = new THREE.SphereGeometry(0.38, 16, 14);
  const eL = new THREE.Mesh(eyeGeo, M.eye);
  eL.position.set(-0.40, 1.25, 0.58);
  g.add(eL);
  const eR = new THREE.Mesh(eyeGeo, M.eye);
  eR.position.set(0.40, 1.25, 0.58);
  g.add(eR);

  const pupGeo = new THREE.SphereGeometry(0.17, 12, 10);
  const pL = new THREE.Mesh(pupGeo, M.pupil);
  pL.position.set(-0.40, 1.25, 0.92);
  g.add(pL);
  const pR = new THREE.Mesh(pupGeo, M.pupil);
  pR.position.set(0.40, 1.25, 0.92);
  g.add(pR);

  const hiGeo = new THREE.SphereGeometry(0.07, 8, 6);
  const hiMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const hiL = new THREE.Mesh(hiGeo, hiMat);
  hiL.position.set(-0.32, 1.34, 1.0);
  g.add(hiL);
  const hiR = new THREE.Mesh(hiGeo, hiMat);
  hiR.position.set(0.32, 1.34, 1.0);
  g.add(hiR);

  // Smile (half torus, arc curves up)
  const mouth = new THREE.Mesh(
    new THREE.TorusGeometry(0.28, 0.035, 4, 16, Math.PI), M.mouth
  );
  mouth.position.set(0, 0.22, 1.02);
  mouth.rotation.z = Math.PI;
  g.add(mouth);

  // Throat (visible when mouth opens)
  const throat = new THREE.Mesh(new THREE.CircleGeometry(0.20, 16), M.mouth);
  throat.position.set(0, 0.22, 0.96);
  throat.scale.setScalar(0.01);
  g.add(throat);

  // Front legs
  const fLG = new THREE.CylinderGeometry(0.12, 0.14, 0.7, 8);
  const fl = new THREE.Mesh(fLG, M.frog);
  fl.position.set(-0.8, -0.55, 0.6);
  fl.rotation.z = 0.25;
  fl.rotation.x = -0.15;
  g.add(fl);
  const fr = new THREE.Mesh(fLG, M.frog);
  fr.position.set(0.8, -0.55, 0.6);
  fr.rotation.z = -0.25;
  fr.rotation.x = -0.15;
  g.add(fr);

  const fFG = new THREE.SphereGeometry(0.16, 8, 6);
  const ffL = new THREE.Mesh(fFG, M.dark);
  ffL.scale.set(1.3, 0.35, 1);
  ffL.position.set(-0.9, -0.9, 0.7);
  g.add(ffL);
  const ffR = new THREE.Mesh(fFG, M.dark);
  ffR.scale.set(1.3, 0.35, 1);
  ffR.position.set(0.9, -0.9, 0.7);
  g.add(ffR);

  // Back thighs
  const tG = new THREE.SphereGeometry(0.55, 16, 12);
  const tl = new THREE.Mesh(tG, M.frog);
  tl.position.set(-0.95, -0.3, -0.35);
  tl.scale.set(1.0, 1.1, 1.2);
  tl.castShadow = true;
  g.add(tl);
  const tr = new THREE.Mesh(tG, M.frog);
  tr.position.set(0.95, -0.3, -0.35);
  tr.scale.set(1.0, 1.1, 1.2);
  tr.castShadow = true;
  g.add(tr);

  const bLG = new THREE.CylinderGeometry(0.09, 0.12, 0.7, 8);
  const bl = new THREE.Mesh(bLG, M.frog);
  bl.position.set(-1.05, -0.75, 0.05);
  bl.rotation.x = -0.4;
  bl.rotation.z = 0.1;
  g.add(bl);
  const br = new THREE.Mesh(bLG, M.frog);
  br.position.set(1.05, -0.75, 0.05);
  br.rotation.x = -0.4;
  br.rotation.z = -0.1;
  g.add(br);

  const bFG = new THREE.SphereGeometry(0.18, 8, 6);
  const bfL = new THREE.Mesh(bFG, M.dark);
  bfL.scale.set(1.5, 0.3, 1.2);
  bfL.position.set(-1.1, -1.05, 0.3);
  g.add(bfL);
  const bfR = new THREE.Mesh(bFG, M.dark);
  bfR.scale.set(1.5, 0.3, 1.2);
  bfR.position.set(1.1, -1.05, 0.3);
  g.add(bfR);

  // Tongue: unit cylinder along local Y, will be scaled & oriented
  const tongueG = new THREE.Group();
  tongueG.position.set(0, 0.22, 0.96);
  tongueG.visible = false;

  const tongueMesh = new THREE.Mesh(
    new THREE.CylinderGeometry(0.035, 0.05, 1, 6), M.tongue
  );
  // Cylinder is along Y by default — perfect, we scale Y for length
  tongueG.add(tongueMesh);

  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 8), M.tongue);
  tongueG.add(tip);

  g.add(tongueG);

  return { g, tongueG, tongueMesh, tip, mouth, throat, eL, eR, pL, pR, hiL, hiR };
}

// ═══════════════════════════════════════════════
//  FROG STATE MACHINE
// ═══════════════════════════════════════════════
const S = { IDLE: 0, WINDUP: 1, SNAP: 2, RETRACT: 3, JUMP: 4, DIVE: 5, SWIM: 6, TURN: 7, HOP: 8 };

function makeFrog(idx) {
  const parts = buildFrog();
  const startX = -2.5 + idx * 2.5;

  const f = {
    ...parts,
    idx,
    state: S.IDLE,
    t: 0,
    dur: 1,
    pos: new THREE.Vector3(startX, FROG_REST_Y, 0),
    from: new THREE.Vector3(),
    to: new THREE.Vector3(),
    facing: 1,
    blinkOff: Math.random() * 5,
    idleDur: 1.5 + Math.random() * 2.5,
    target: null,
    mouthOpen: 0,
    turnFrom: 0,
    turnTo: 0,
  };
  parts.g.position.copy(f.pos);
  scene.add(parts.g);
  return f;
}

const frogs = [makeFrog(0), makeFrog(1), makeFrog(2)];

// ── Spacing helpers ──
function frogsClear(pos, excludeIdx) {
  for (let i = 0; i < frogs.length; i++) {
    if (i === excludeIdx) continue;
    if (pos.distanceTo(frogs[i].pos) < FROG_MIN_DIST) return false;
  }
  return true;
}

function findClearLogX(excludeIdx) {
  for (let attempt = 0; attempt < 25; attempt++) {
    const x = -LOG_HALF + 1.0 + Math.random() * (LOG_HALF * 2 - 2.0);
    const test = new THREE.Vector3(x, FROG_REST_Y, 0);
    if (frogsClear(test, excludeIdx)) return x;
  }
  const slots = [-3, 0, 3];
  for (const s of slots) {
    const test = new THREE.Vector3(s, FROG_REST_Y, 0);
    if (frogsClear(test, excludeIdx)) return s;
  }
  return -3 + excludeIdx * 3;
}

function findClearSwimTarget(excludeIdx, biasX) {
  for (let attempt = 0; attempt < 20; attempt++) {
    const x = THREE.MathUtils.clamp(biasX + (Math.random() - 0.5) * 8, -10, 10);
    const z = 3 + Math.random() * 8;
    const test = new THREE.Vector3(x, SWIM_Y, z);
    if (frogsClear(test, excludeIdx)) return new THREE.Vector3(x, SWIM_Y, z);
  }
  return new THREE.Vector3(excludeIdx * 3, SWIM_Y, 5);
}

// ── Soft separation (applied every frame) ──
function applySeparation(dt) {
  for (let i = 0; i < frogs.length; i++) {
    for (let j = i + 1; j < frogs.length; j++) {
      const a = frogs[i], b = frogs[j];
      const delta = a.pos.clone().sub(b.pos);
      const dist = delta.length();
      if (dist < FROG_MIN_DIST && dist > 0.01) {
        const push = delta.normalize().multiplyScalar((FROG_MIN_DIST - dist) * SEP_STRENGTH * dt);
        // Only push frogs that are on the log (not mid-jump/dive)
        if (a.state === S.IDLE && b.state === S.IDLE) {
          a.pos.add(push);
          b.pos.sub(push);
          // Clamp to log bounds
          a.pos.x = THREE.MathUtils.clamp(a.pos.x, -LOG_HALF + 0.5, LOG_HALF - 0.5);
          b.pos.x = THREE.MathUtils.clamp(b.pos.x, -LOG_HALF + 0.5, LOG_HALF - 0.5);
          a.pos.z = 0;
          b.pos.z = 0;
          a.g.position.copy(a.pos);
          b.g.position.copy(b.pos);
        } else if (a.state === S.IDLE) {
          a.pos.add(push);
          a.pos.x = THREE.MathUtils.clamp(a.pos.x, -LOG_HALF + 0.5, LOG_HALF - 0.5);
          a.pos.z = 0;
          a.g.position.copy(a.pos);
        } else if (b.state === S.IDLE) {
          b.pos.sub(push);
          b.pos.x = THREE.MathUtils.clamp(b.pos.x, -LOG_HALF + 0.5, LOG_HALF - 0.5);
          b.pos.z = 0;
          b.g.position.copy(b.pos);
        }
      }
    }
  }
}

// ── Tongue aiming ──
function aimTongue(f, targetWorldPos) {
  const mouthLocal = new THREE.Vector3(0, 0, 0); // tongueG origin IS the mouth
  const targetLocal = f.g.worldToLocal(targetWorldPos.clone());
  const dir = targetLocal.clone().normalize();
  const dist = targetLocal.length();

  // Orient tongueG so its local +Y points along dir
  const up = new THREE.Vector3(0, 1, 0);
  const q = new THREE.Quaternion().setFromUnitVectors(up, dir);
  f.tongueG.quaternion.copy(q);

  // Scale and position the cylinder (unit height along Y)
  const len = Math.min(dist, TONGUE_MAX);
  f.tongueMesh.scale.y = len;
  f.tongueMesh.position.y = len / 2;
  f.tip.position.y = len;

  return len;
}

// ── Mouth open/close ──
function setMouth(f, openness) {
  f.mouthOpen = openness;
  f.mouth.scale.set(1 + openness * 0.4, 0.15 + openness * 0.85, 1);
  f.mouth.position.y = 0.22 - openness * 0.08;
  f.throat.scale.setScalar(0.01 + openness * 0.95);
}

// ── Pick next action ──
function pickAction(f) {
  f.t = 0;
  setMouth(f, 0);
  f.tongueG.visible = false;
  const r = Math.random();

  if (r < 0.22) {
    f.state = S.IDLE;
    f.idleDur = 1.5 + Math.random() * 3;
  } else if (r < 0.52) {
    // Jump along log
    f.state = S.JUMP;
    f.dur = 0.5 + Math.random() * 0.25;
    f.from.copy(f.pos);
    const dist = 1.5 + Math.random() * 2.0;
    let newX = f.pos.x + f.facing * dist;
    if (newX > LOG_HALF - 0.5) { f.facing = -1; newX = f.pos.x + f.facing * dist; }
    if (newX < -LOG_HALF + 0.5) { f.facing = 1; newX = f.pos.x + f.facing * dist; }
    newX = THREE.MathUtils.clamp(newX, -LOG_HALF + 0.5, LOG_HALF - 0.5);
    const testPos = new THREE.Vector3(newX, FROG_REST_Y, 0);
    if (frogsClear(testPos, f.idx)) {
      f.to.set(newX, FROG_REST_Y, 0);
    } else {
      f.to.set(findClearLogX(f.idx), FROG_REST_Y, 0);
    }
  } else if (r < 0.72) {
    // Dive
    f.state = S.DIVE;
    f.dur = 0.6 + Math.random() * 0.2;
    f.from.copy(f.pos);
    f.to.set(f.pos.x + (Math.random() - 0.5) * 3, SWIM_Y, 3 + Math.random() * 7);
    if (!frogsClear(f.to, f.idx)) f.to = findClearSwimTarget(f.idx, f.pos.x);
  } else {
    f.state = S.IDLE;
    f.idleDur = 1.0 + Math.random() * 2.5;
  }
}

// ── Main frog update ──
function updateFrog(f, t, dt) {
  f.t += dt;
  const p = f.g;
  const prog = Math.min(f.t / f.dur, 1);

  switch (f.state) {
    case S.IDLE: {
      p.position.set(f.pos.x, FROG_REST_Y + Math.sin(t * 3 + f.blinkOff) * 0.03, f.pos.z);
      p.rotation.set(0, 0, 0);
      p.scale.set(1, 1, 1);
      setMouth(f, 0);
      f.tongueG.visible = false;

      // Blink (quick squint, not full flatten)
      const bc = (t + f.blinkOff) % 3.5;
      const bs = (bc > 3.3 && bc < 3.42) ? 0.35 : 1;
      f.eL.scale.y = f.pL.scale.y = f.hiL.scale.y = bs;
      f.eR.scale.y = f.pR.scale.y = f.hiR.scale.y = bs;

      // Look for flies
      let best = null, bestD = CATCH_RANGE;
      const mouthWorld = new THREE.Vector3(f.pos.x, FROG_REST_Y + 0.22, 1.0);
      for (const fly of flies) {
        if (fly.dead) continue;
        const d = fly.mesh.position.distanceTo(mouthWorld);
        if (d < bestD) { bestD = d; best = fly; }
      }

      if (f.t > f.idleDur) {
        if (best) {
          f.state = S.WINDUP;
          f.t = 0;
          f.dur = 0.25;
          f.target = best;
        } else {
          pickAction(f);
        }
      }
      break;
    }

    case S.WINDUP: {
      setMouth(f, prog);
      p.position.set(f.pos.x, FROG_REST_Y - prog * 0.08, f.pos.z);
      p.scale.set(1 + prog * 0.1, 1 - prog * 0.08, 1 + prog * 0.1);
      p.rotation.set(0, 0, 0);

      // Eyes track
      if (f.target && !f.target.dead) {
        const dir = f.target.mesh.position.clone().sub(f.pos).normalize();
        f.pL.position.x = -0.40 + dir.x * 0.05;
        f.pL.position.y = 1.25 + dir.y * 0.03;
        f.pR.position.x = 0.40 + dir.x * 0.05;
        f.pR.position.y = 1.25 + dir.y * 0.03;
      }

      if (prog >= 1) {
        f.state = S.SNAP;
        f.t = 0;
        f.dur = 0.15;
        f.tongueG.visible = true;
        if (f.target) aimTongue(f, f.target.mesh.position);
      }
      break;
    }

    case S.SNAP: {
      setMouth(f, 1);
      p.position.set(f.pos.x, FROG_REST_Y + 0.05, f.pos.z);
      p.scale.set(0.92, 1.15, 0.92);

      // Tongue extends — re-aim each frame for smooth tracking
      if (f.target && !f.target.dead) {
        aimTongue(f, f.target.mesh.position);
        if (prog >= 0.85) {
          f.target.dead = true;
          f.target.deadT = 0;
        }
      }

      if (prog >= 1) {
        f.state = S.RETRACT;
        f.t = 0;
        f.dur = 0.22;
      }
      break;
    }

    case S.RETRACT: {
      const s = 1 - prog;
      setMouth(f, s);

      if (f.target) {
        const targetLocal = f.g.worldToLocal(f.target.mesh.position.clone());
        const dist = targetLocal.length();
        const len = Math.min(dist, TONGUE_MAX) * s;
        f.tongueMesh.scale.y = Math.max(0.01, len);
        f.tongueMesh.position.y = Math.max(0.005, len / 2);
        f.tip.position.y = Math.max(0.01, len);
      }

      p.position.set(f.pos.x, FROG_REST_Y, f.pos.z);
      p.scale.set(1, 1, 1);

      if (prog >= 1) {
        f.tongueG.visible = false;
        f.tongueG.quaternion.identity();
        f.tongueMesh.scale.y = 1;
        f.tongueMesh.position.y = 0;
        f.tip.position.y = 0;
        f.target = null;
        f.pL.position.set(-0.40, 1.25, 0.92);
        f.pR.position.set(0.40, 1.25, 0.92);
        pickAction(f);
      }
      break;
    }

    case S.JUMP: {
      const arcH = 2.0;
      const x = THREE.MathUtils.lerp(f.from.x, f.to.x, prog);
      // Ensure arc stays above log
      const y = FROG_REST_Y + Math.sin(prog * Math.PI) * arcH;
      const stretch = 1 + Math.sin(prog * Math.PI) * 0.3;
      p.scale.set(1 / Math.sqrt(stretch), stretch, 1 / Math.sqrt(stretch));
      p.position.set(x, y, 0);
      p.rotation.z = (f.to.x - f.from.x) * -0.04;
      f.pos.set(x, y, 0);
      setMouth(f, 0);

      if (prog >= 1) {
        f.pos.set(f.to.x, FROG_REST_Y, 0);
        p.position.copy(f.pos);
        p.rotation.z = 0;
        p.scale.set(1.2, 0.75, 1.2);
        pickAction(f);
      }
      break;
    }

    case S.DIVE: {
      const ease = prog * prog;
      const x = THREE.MathUtils.lerp(f.from.x, f.to.x, ease);
      const y = Math.max(WATER_Y + 0.1, THREE.MathUtils.lerp(f.from.y, f.to.y, ease));
      const z = THREE.MathUtils.lerp(f.from.z, f.to.z, ease);
      p.position.set(x, y, z);
      p.rotation.x = -prog * 0.6;
      p.scale.set(0.9, 1.1, 0.9);
      f.pos.set(x, y, z);
      setMouth(f, 0);

      if (prog >= 1) {
        const sp = splashes.find(s => s.timer < 0);
        if (sp) {
          sp.timer = 0;
          sp.mesh.position.set(f.pos.x, 0.06, f.pos.z);
          sp.mesh.visible = true;
        }
        f.state = S.SWIM;
        f.t = 0;
        f.dur = 2.5 + Math.random() * 3;
        f.from.copy(f.pos);
        f.to = findClearSwimTarget(f.idx, f.pos.x + (Math.random() - 0.5) * 4);
      }
      break;
    }

    case S.SWIM: {
      const ease = THREE.MathUtils.smoothstep(prog, 0, 1);
      const x = THREE.MathUtils.lerp(f.from.x, f.to.x, ease);
      const z = THREE.MathUtils.lerp(f.from.z, f.to.z, ease);
      const bob = Math.sin(t * 5 + f.blinkOff) * 0.06;
      const y = Math.max(WATER_Y + 0.1, SWIM_Y + bob);
      p.position.set(x, y, z);
      p.rotation.x = 0;
      p.rotation.y = Math.sin(t * 1.5 + f.blinkOff) * 0.3;
      p.scale.set(1, 0.8, 1);
      f.pos.set(x, y, z);
      setMouth(f, 0);

      if (prog >= 1) {
        // Must TURN to face log before hopping
        f.state = S.TURN;
        f.t = 0;
        f.dur = 0.4;
        f.turnFrom = p.rotation.y;
        // Face the log: log is at z=0, frog is at z>0, so face -Z direction
        // rotation.y = PI means facing -Z in three.js (default forward is -Z for cameras, but for objects +Z is "forward")
        // Our frog's mouth is at +Z, so to face the log (which is at z=0, behind the frog) we need rotation.y = PI
        f.turnTo = Math.PI;
        f.from.copy(f.pos);
        const targetX = findClearLogX(f.idx);
        f.to.set(targetX, FROG_REST_Y, 0);
      }
      break;
    }

    case S.TURN: {
      // Smoothly rotate to face the log
      const ease = THREE.MathUtils.smoothstep(prog, 0, 1);
      p.rotation.y = THREE.MathUtils.lerp(f.turnFrom, f.turnTo, ease);
      // Small bob while turning
      const bob = Math.sin(t * 6) * 0.04;
      p.position.set(f.pos.x, Math.max(WATER_Y + 0.1, SWIM_Y + bob), f.pos.z);
      p.scale.set(1, 0.85, 1);
      setMouth(f, 0);

      if (prog >= 1) {
        f.state = S.HOP;
        f.t = 0;
        f.dur = 0.55;
        f.from.copy(f.pos);
        p.rotation.y = f.turnTo;
      }
      break;
    }

    case S.HOP: {
      const x = THREE.MathUtils.lerp(f.from.x, f.to.x, prog);
      const y = Math.max(LOG_TOP + 0.1, THREE.MathUtils.lerp(f.from.y, f.to.y, prog) + Math.sin(prog * Math.PI) * 2.2);
      const z = THREE.MathUtils.lerp(f.from.z, f.to.z, prog);
      const stretch = 1 + Math.sin(prog * Math.PI) * 0.25;
      p.position.set(x, y, z);
      p.scale.set(1 / Math.sqrt(stretch), stretch, 1 / Math.sqrt(stretch));
      p.rotation.set(0, f.turnTo, 0);
      f.pos.set(x, y, z);
      setMouth(f, 0);

      if (prog >= 1) {
        f.pos.set(f.to.x, FROG_REST_Y, 0);
        p.position.copy(f.pos);
        p.rotation.set(0, 0, 0); // face forward again
        p.scale.set(1.2, 0.75, 1.2);
        pickAction(f);
      }
      break;
    }
  }
}

// ═══════════════════════════════════════════════
//  INSECTS
// ═══════════════════════════════════════════════
let flockPoint = null;
let flockTimer = 0;
let flockActive = false;
let flockEnd = 0;
const FLOCK_INTERVAL = 9;

function updateFlock(dt, t) {
  flockTimer += dt;
  if (flockTimer > FLOCK_INTERVAL) {
    flockTimer = 0;
    flockPoint = new THREE.Vector3(
      (Math.random() - 0.5) * 20,
      3 + Math.random() * 7,
      (Math.random() - 0.5) * 12 + 4
    );
    flockActive = true;
    flockEnd = t + 3 + Math.random() * 3;
  }
  if (flockActive && t > flockEnd) {
    flockActive = false;
    flockPoint = null;
  }
}

// Flies
const flies = Array.from({ length: 14 }, () => {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8), M.fly));
  const wG = new THREE.SphereGeometry(0.07, 4, 3);
  const w1 = new THREE.Mesh(wG, M.wing);
  const w2 = new THREE.Mesh(wG, M.wing);
  w1.position.set(0.07, 0.05, 0);
  w2.position.set(-0.07, 0.05, 0);
  g.add(w1);
  g.add(w2);
  scene.add(g);

  const pos = new THREE.Vector3(
    (Math.random() - 0.5) * 24,
    2 + Math.random() * 8,
    -4 + Math.random() * 18
  );
  g.position.copy(pos);

  return {
    mesh: g, w: [w1, w2],
    pos,
    vel: new THREE.Vector3((Math.random()-0.5)*2, (Math.random()-0.5), (Math.random()-0.5)*2),
    dead: false, deadT: 0,
    wanderSeed: Math.random() * 100,
    flockWeight: 0.4 + Math.random() * 0.6,
  };
});

function updateFlies(t, dt) {
  for (const fly of flies) {
    if (fly.dead) {
      fly.deadT += dt;
      fly.mesh.scale.setScalar(Math.max(0.01, 1 - fly.deadT * 2.5));
      if (fly.deadT > 3) {
        fly.dead = false;
        fly.deadT = 0;
        fly.pos.set((Math.random()-0.5)*24, 2+Math.random()*8, -4+Math.random()*18);
        fly.vel.set((Math.random()-0.5)*2, (Math.random()-0.5), (Math.random()-0.5)*2);
      }
      continue;
    }
    fly.mesh.scale.setScalar(1);
    const s = fly.wanderSeed;
    fly.vel.x += (Math.sin(t * 0.7 + s) * 1.2 + (Math.random()-0.5) * 4) * dt;
    fly.vel.y += (Math.sin(t * 0.5 + s * 1.3) * 0.6 + (Math.random()-0.5) * 2) * dt;
    fly.vel.z += (Math.cos(t * 0.6 + s * 0.7) * 1.2 + (Math.random()-0.5) * 4) * dt;

    if (flockActive && flockPoint) {
      const toFlock = flockPoint.clone().sub(fly.pos).normalize();
      fly.vel.addScaledVector(toFlock, dt * 2.5 * fly.flockWeight);
    }

    fly.vel.multiplyScalar(1 - dt * 1.2);
    const spd = fly.vel.length();
    if (spd > 3.5) fly.vel.multiplyScalar(3.5 / spd);
    fly.pos.addScaledVector(fly.vel, dt);

    // Soft bounds
    if (fly.pos.x < -14) fly.vel.x += dt * 6;
    if (fly.pos.x > 14) fly.vel.x -= dt * 6;
    if (fly.pos.y < 1.5) fly.vel.y += dt * 6;
    if (fly.pos.y > 12) fly.vel.y -= dt * 6;
    if (fly.pos.z < -5) fly.vel.z += dt * 6;
    if (fly.pos.z > 18) fly.vel.z -= dt * 6;

    fly.mesh.position.copy(fly.pos);
    fly.mesh.rotation.y = Math.atan2(fly.vel.x, fly.vel.z);
    const flap = Math.sin(t * 28 + fly.wanderSeed) * 0.6;
    fly.w[0].rotation.y = flap;
    fly.w[1].rotation.y = -flap;
  }
}

// Fireflies
const fireflies = Array.from({ length: 14 }, () => {
  const g = new THREE.Group();
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), M.fire);
  const glow = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6), M.fireG.clone());
  g.add(core);
  g.add(glow);
  const bx = (Math.random() - 0.5) * 36;
  const by = 0.5 + Math.random() * 8;
  const bz = -6 + Math.random() * 20;
  g.position.set(bx, by, bz);
  scene.add(g);
  return {
    mesh: g, glow, bx, by, bz,
    sp: 0.1 + Math.random() * 0.4,
    ph: Math.random() * Math.PI * 2,
    pulse: 1.5 + Math.random() * 4,
  };
});

// Moths
const moths = Array.from({ length: 5 }, () => {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.2, 4, 6), M.moth));
  const wG = new THREE.SphereGeometry(0.2, 6, 4);
  const wL = new THREE.Mesh(wG, M.mothW);
  const wR = new THREE.Mesh(wG, M.mothW);
  wL.position.set(-0.2, 0, 0);
  wL.scale.set(1, 1.4, 0.25);
  wR.position.set(0.2, 0, 0);
  wR.scale.set(1, 1.4, 0.25);
  g.add(wL);
  g.add(wR);
  scene.add(g);
  return {
    mesh: g, w: [wL, wR],
    bx: (Math.random() - 0.5) * 28,
    by: 3 + Math.random() * 7,
    bz: -4 + Math.random() * 16,
    sp: 0.15 + Math.random() * 0.3,
    ph: Math.random() * Math.PI * 2,
    wob: 0.3 + Math.random() * 1.5,
  };
});

// Butterfly
const bflyG = new THREE.Group();
const bWG = new THREE.SphereGeometry(0.14, 8, 6);
const bW1 = new THREE.Mesh(bWG, M.bfly);
const bW2 = new THREE.Mesh(bWG, M.bfly);
bW1.position.set(-0.14, 0, 0);
bW1.scale.set(1, 1.4, 0.25);
bW2.position.set(0.14, 0, 0);
bW2.scale.set(1, 1.4, 0.25);
bflyG.add(bW1);
bflyG.add(bW2);
scene.add(bflyG);

// ═══════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════
let lastTime = 0;
let rainIntensity = 0;

function loop(now) {
  requestAnimationFrame(loop);
  const t = now * 0.001;
  const dt = Math.min(t - lastTime, 0.05);
  lastTime = t;

  // Rain
  rainTimer += dt;
  if (rainTimer > RAIN_CYCLE) { rainTimer = 0; raining = !raining; }
  rainIntensity += ((raining ? 1 : 0) - rainIntensity) * dt * 2;
  const activeDrops = Math.floor(RAIN_COUNT * rainIntensity);

  for (let i = 0; i < RAIN_COUNT; i++) {
    const drop = rainMeshes[i];
    if (i < activeDrops) {
      drop.visible = true;
      drop.position.y -= 22 * dt;
      if (drop.position.y < 0) {
        drop.position.y = 25 + Math.random() * 10;
        drop.position.x = (Math.random() - 0.5) * 50;
        drop.position.z = (Math.random() - 0.5) * 30;
      }
    } else {
      drop.visible = false;
    }
  }

  // Water
  const wp = wGeo.attributes.position;
  for (let i = 0; i < wp.count; i++) {
    const x = wp.getX(i), y = wp.getY(i);
    const amp = 0.08 + rainIntensity * 0.08;
    wp.setZ(i, Math.sin(x * 0.3 + t * 0.6) * amp + Math.cos(y * 0.25 + t * 0.4) * amp * 0.7);
  }
  wp.needsUpdate = true;
  wGeo.computeVertexNormals();

  // Frogs + separation
  for (const f of frogs) updateFrog(f, t, dt);
  applySeparation(dt);

  // Insects
  updateFlock(dt, t);
  updateFlies(t, dt);

  for (const ff of fireflies) {
    ff.mesh.position.set(
      ff.bx + Math.sin(t * ff.sp + ff.ph) * 4,
      ff.by + Math.sin(t * 0.4 + ff.ph) * 1.2,
      ff.bz + Math.cos(t * ff.sp * 0.7 + ff.ph) * 3
    );
    const pulse = 0.5 + Math.sin(t * ff.pulse + ff.ph) * 0.5;
    ff.glow.scale.setScalar(0.3 + pulse);
    ff.glow.material.opacity = 0.06 + pulse * 0.25;
  }

  for (const m of moths) {
    m.mesh.position.set(
      m.bx + Math.cos(t * m.sp + m.ph) * 5 + Math.sin(t * m.wob + m.ph) * 1.5,
      m.by + Math.sin(t + m.ph) * 1.5,
      m.bz + Math.sin(t * m.sp * 0.8 + m.ph) * 4
    );
    m.mesh.rotation.y = t * m.sp + m.ph + Math.PI / 2;
    const flap = Math.sin(t * 5 + m.ph) * 0.4;
    m.w[0].rotation.y = flap;
    m.w[1].rotation.y = -flap;
  }

  bflyG.position.set(
    5 + Math.sin(t * 0.4) * 10,
    8 + Math.sin(t * 0.9) * 3,
    3 + Math.cos(t * 0.3) * 8
  );
  bflyG.rotation.y = Math.sin(t * 0.4) * 0.8;
  const bflap = Math.sin(t * 16) * 0.5;
  bW1.scale.y = 1 + bflap;
  bW2.scale.y = 1 + bflap;

  // Clouds
  for (const c of clouds) {
    c.group.position.x += c.speed * dt;
    if (c.group.position.x > 40) c.group.position.x = -40;
  }

  // Grass
  for (let i = 0; i < grass.length; i++) {
    grass[i].rotation.z = Math.sin(t * 1.5 + i * 0.8) * 0.08 + rainIntensity * Math.sin(t * 8 + i) * 0.1;
  }

  // Lilies
  for (let i = 0; i < lilies.length; i++) {
    lilies[i].position.y = 0.03 + Math.sin(t * 0.8 + i * 1.3) * 0.04;
  }

  // Flowers
  for (const fl of flowers) {
    fl.petal.position.y = fl.baseY + Math.sin(t * 1.3) * 0.03;
    fl.center.position.y = fl.baseY + 0.06 + Math.sin(t * 1.3) * 0.03;
  }

  // Ripples
  for (let i = 0; i < ripples.length; i++) {
    const p = (t * 0.35 + i * 0.4) % 2.5;
    ripples[i].scale.setScalar(1 + p * 2);
    ripples[i].material.opacity = Math.max(0, 0.3 * (1 - p / 2.5));
  }

  // Splashes
  for (const sp of splashes) {
    if (sp.timer < 0) continue;
    sp.timer += dt;
    const p = sp.timer / sp.maxT;
    if (p >= 1) { sp.timer = -1; sp.mesh.visible = false; continue; }
    sp.mesh.visible = true;
    sp.mesh.scale.setScalar(1 + p * 5);
    sp.mesh.material.opacity = 0.4 * (1 - p);
  }

  // Moon glow
  moonG.children[1].material.opacity = 0.10 + Math.sin(t * 0.3) * 0.04;

  // Camera
  cam.position.x = Math.sin(t * 0.04) * 2;
  cam.position.y = 4.5 + Math.sin(t * 0.06) * 0.5;
  cam.lookAt(0, 2, 0);

  renderer.render(scene, cam);
}

requestAnimationFrame(loop);

addEventListener("resize", () => {
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
