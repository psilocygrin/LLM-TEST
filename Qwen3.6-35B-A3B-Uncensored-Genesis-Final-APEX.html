<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tortoise Forest Road</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
  svg { max-width: 100vw; max-height: 100vh; }

  @keyframes sunPulse {
    0%, 100% { filter: drop-shadow(0 0 30px rgba(255,210,50,0.6)); }
    50% { filter: drop-shadow(0 0 50px rgba(255,210,50,0.9)); }
  }
  @keyframes cloudDrift1 {
    0% { transform: translateX(-80px); }
    100% { transform: translateX(960px); }
  }
  @keyframes cloudDrift2 {
    0% { transform: translateX(-150px); }
    100% { transform: translateX(1040px); }
  }
  @keyframes cloudDrift3 {
    0% { transform: translateX(-200px); }
    100% { transform: translateX(1100px); }
  }
  @keyframes walkBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  @keyframes headBounce {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    25% { transform: rotate(4deg) translateY(2px); }
    75% { transform: rotate(-4deg) translateY(-2px); }
  }
  @keyframes tailWag {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(6deg); }
  }
  @keyframes frontLeftLeg {
    0%, 100% { transform: rotate(-25deg); }
    25% { transform: rotate(5deg); }
    50% { transform: rotate(25deg); }
    75% { transform: rotate(-5deg); }
  }
  @keyframes frontRightLeg {
    0%, 100% { transform: rotate(25deg); }
    25% { transform: rotate(-5deg); }
    50% { transform: rotate(-25deg); }
    75% { transform: rotate(5deg); }
  }
  @keyframes backLeftLeg {
    0%, 100% { transform: rotate(25deg); }
    25% { transform: rotate(-10deg); }
    50% { transform: rotate(-30deg); }
    75% { transform: rotate(8deg); }
  }
  @keyframes backRightLeg {
    0%, 100% { transform: rotate(-25deg); }
    25% { transform: rotate(10deg); }
    50% { transform: rotate(30deg); }
    75% { transform: rotate(-8deg); }
  }

  @keyframes butterfly1 {
    0% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(40px, -20px) scale(0.9); }
    50% { transform: translate(80px, 10px) scale(1.1); }
    75% { transform: translate(30px, -15px) scale(0.95); }
    100% { transform: translate(0, 0) scale(1); }
  }
  @keyframes butterfly2 {
    0% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(-30px, -25px) scale(1.05); }
    66% { transform: translate(20px, -10px) scale(0.9); }
    100% { transform: translate(0, 0) scale(1); }
  }
  @keyframes flowerSway {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(2deg); }
  }
  @keyframes birdFly {
    0% { transform: translateX(0) translateY(0); }
    33% { transform: translateX(150px) translateY(-15px); }
    66% { transform: translateX(300px) translateY(5px); }
    100% { transform: translateX(450px) translateY(-8px); }
  }
  @keyframes leafFall1 {
    0% { transform: translate(0,0) rotate(0deg); opacity: 1; }
    100% { transform: translate(60px, 300px) rotate(720deg); opacity: 0; }
  }
  @keyframes leafFall2 {
    0% { transform: translate(0,0) rotate(0deg); opacity: 1; }
    100% { transform: translate(-40px, 350px) rotate(-540deg); opacity: 0; }
  }

  .sun-glow { animation: sunPulse 4s ease-in-out infinite; }
  .cloud-1 { animation: cloudDrift1 60s linear infinite; }
  .cloud-2 { animation: cloudDrift2 85s linear infinite; }
  .cloud-3 { animation: cloudDrift3 110s linear infinite; }

  @keyframes tortoiseWalk {
    0% { transform: translateX(-450px); }
    100% { transform: translateX(1080px); }
  }
  .tortoise-group {
    animation: tortoiseWalk 25s linear infinite;
  }
  .walk-bob {
    animation: walkBob 0.75s ease-in-out infinite;
    transform-origin: 150px 305px;
  }

  /* --- WHEEL (rotational) ANIMATIONS --- */
  @keyframes fl {
    0%   { transform: rotate(-22deg); }
    25%  { transform: rotate(4deg); }
    50%  { transform: rotate(26deg); }
    75%  { transform: rotate(-3deg); }
    100% { transform: rotate(-22deg); }
  }
  @keyframes fr {
    0%   { transform: rotate(24deg); }
    25%  { transform: rotate(-3deg); }
    50%  { transform: rotate(-26deg); }
    75%  { transform: rotate(4deg); }
    100% { transform: rotate(24deg); }
  }
  @keyframes bl {
    0%   { transform: rotate(24deg); }
    25%  { transform: rotate(-8deg); }
    50%  { transform: rotate(-28deg); }
    75%  { transform: rotate(6deg); }
    100% { transform: rotate(24deg); }
  }
  @keyframes br {
    0%   { transform: rotate(-24deg); }
    25%  { transform: rotate(8deg); }
    50%  { transform: rotate(28deg); }
    75%  { transform: rotate(-6deg); }
    100% { transform: rotate(-24deg); }
  }
  @keyframes headM {
    0%,100% { transform: rotate(0deg) translateX(0); }
    30%     { transform: rotate(8deg) translateX(6px); }
    70%     { transform: rotate(-5deg) translateX(-2px); }
  }
  @keyframes tailM {
    0%,100% { transform: rotate(0deg); }
    50%     { transform: rotate(8deg); }
  }

  .fl-limbs  { animation: fl       0.75s ease-in-out infinite; transform-origin: 93px 242px; }
  .fr-limbs  { animation: fr       0.75s ease-in-out infinite; transform-origin: 91px 313px; }
  .bl-limbs  { animation: bl       0.75s ease-in-out infinite; transform-origin: 234px 265px; }
  .br-limbs  { animation: br       0.75s ease-in-out infinite; transform-origin: 231px 318px; }
  .head-anim { animation: headM    1.8s ease-in-out infinite; transform-origin: 163px 228px; }
  .tail-anim { animation: tailM    2s ease-in-out infinite; transform-origin: 270px 285px; }

  .butterfly-1 { animation: butterfly1 12s ease-in-out infinite; }
  .butterfly-2 { animation: butterfly2 15s ease-in-out infinite; }
  .flower-sway { animation: flowerSway 3s ease-in-out infinite; transform-origin: center bottom; }
  .bird-group  { animation: birdFly    18s linear infinite; }

  .leaf-1 { animation: leafFall1     6s ease-in-out infinite; }
  .leaf-2 { animation: leafFall2     7s ease-in-out infinite; }
  .leaf-3 { animation: leafFall1     8s ease-in-out infinite 2s; }
  .leaf-4 { animation: leafFall2     5.5s ease-in-out infinite 1.5s; }

  @keyframes wingFlap {
    0%, 100% { transform: scaleX(1); }
    50% { transform: scaleX(0.3); }
  }
  .wing-left  { animation: wingFlap 0.2s ease-in-out infinite; transform-origin: right center; }
  .wing-right { animation: wingFlap 0.2s ease-in-out infinite; transform-origin: left center; }
</style>
</head>
<body>

<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- SKY GRADIENT -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e6fc4"/>
      <stop offset="35%" stop-color="#5ba3e8"/>
      <stop offset="65%" stop-color="#9fd8f7"/>
      <stop offset="100%" stop-color="#d4ecff"/>
    </linearGradient>

    <!-- SUN RADIUS GRADIENT -->
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fffbe6"/>
      <stop offset="30%"  stop-color="#ffe87c"/>
      <stop offset="70%"  stop-color="#ffd93a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffaa00" stop-opacity="0"/>
    </radialGradient>

    <!-- MOUNTAIN GRADIENTS -->
    <linearGradient id="mtnFarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c7fa3"/>
      <stop offset="45%" stop-color="#4a6a8f"/>
      <stop offset="100%" stop-color="#3a5a7a"/>
    </linearGradient>
    <linearGradient id="mtnNearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d6b4e"/>
      <stop offset="50%" stop-color="#2d5a3f"/>
      <stop offset="100%" stop-color="#1e4a2f"/>
    </linearGradient>

    <!-- GROUND GRADIENT -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a8a3e"/>
      <stop offset="40%" stop-color="#4d7d32"/>
      <stop offset="100%" stop-color="#3a6622"/>
    </linearGradient>

    <!-- ROAD GRADIENT -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#777777"/>
      <stop offset="30%" stop-color="#6e6e6e"/>
      <stop offset="70%" stop-color="#686868"/>
      <stop offset="100%" stop-color="#5e5e5e"/>
    </linearGradient>

    <!-- TURTLE SHELL GRADIENT -->
    <radialGradient id="shellGrad" cx="42%" cy="35%" r="55%">
      <stop offset="0%"   stop-color="#b89a5c"/>
      <stop offset="25%"  stop-color="#9e7e44"/>
      <stop offset="55%"  stop-color="#7a5f30"/>
      <stop offset="85%"  stop-color="#5e441f"/>
      <stop offset="100%" stop-color="#4a3318"/>
    </radialGradient>

    <!-- TURTLE HEAD GRADIENT -->
    <radialGradient id="headGrad" cx="45%" cy="40%" r="50%">
      <stop offset="0%"   stop-color="#6e8a42"/>
      <stop offset="100%" stop-color="#527a30"/>
    </radialGradient>

    <!-- TURTLE LEG GRADIENT -->
    <linearGradient id="legGrad" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#5e8836"/>
      <stop offset="100%" stop-color="#4a7a28"/>
    </linearGradient>

    <!-- TURTLE PAWS GRADIENT -->
    <radialGradient id="pawGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4e6e30"/>
      <stop offset="100%" stop-color="#3c5a22"/>
    </radialGradient>

    <!-- TREE GRADIENT -->
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d5a1e"/>
      <stop offset="50%" stop-color="#3a6e2c"/>
      <stop offset="100%" stop-color="#285420"/>
    </linearGradient>

    <!-- TREE TRUNK GRADIENT -->
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="1" y2="0%">
      <stop offset="0%" stop-color="#5a3a1e"/>
      <stop offset="50%" stop-color="#6e4e2e"/>
      <stop offset="100%" stop-color="#523618"/>
    </linearGradient>

    <!-- SHADOW GRADIENT -->
    <radialGradient id="shadowGrad">
      <stop offset="0%"   stop-color="rgba(0,0,0,0.2)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

    <!-- EARTH GRADIENT for flowers -->
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a5a22"/>
      <stop offset="100%" stop-color="#2e4c18"/>
    </linearGradient>

    <!-- TURTLE EYE DEPTH -->
    <radialGradient id="eyeDepth" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1a1a1a"/>
      <stop offset="60%"  stop-color="#0e0e0e"/>
      <stop offset="100%" stop-color="#222"/>
    </radialGradient>

    <!-- CLOUD SHAPE -->
    <filter id="cloudBlur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>

    <!-- GLOW FILTER -->
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- SOFT GLOW -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="shellClip">
      <ellipse cx="155" cy="278" rx="62" ry="42"/>
    </clipPath>
  </defs>

  <!-- ===================== SKY ===================== -->
  <rect width="900" height="560" fill="url(#skyGrad)"/>

  <!-- ===================== SUN & GLOW ===================== -->
  <g class="sun-glow">
    <circle cx="740" cy="80" r="120" fill="url(#sunGrad)" opacity="0.9"/>
  </g>
  <circle cx="740" cy="80" r="38" fill="#fff8dc"/>
  <circle cx="740" cy="80" r="32" fill="#fffbe6" filter="url(#glowFilter)"/>

  <!-- SUN RAYS -->
  <g opacity="0.15" stroke="#ffe87c" stroke-width="2">
    <line x1="740" y1="20" x2="740" y2="0"/>
    <line x1="740" y1="140" x2="740" y2="160"/>
    <line x1="680" y1="80" x2="660" y2="80"/>
    <line x1="800" y1="80" x2="820" y2="80"/>
    <line x1="697" y1="37" x2="683" y2="23"/>
    <line x1="783" y1="123" x2="797" y2="137"/>
    <line x1="783" y1="37" x2="797" y2="23"/>
    <line x1="697" y1="123" x2="683" y2="137"/>
  </g>

  <!-- ===================== DISTANT CLOUDS ===================== -->
  <!-- Cloud 1 -->
  <g class="cloud-1" opacity="0.85">
    <g filter="url(#cloudBlur)">
      <ellipse cx="340" cy="65" rx="70" ry="22" fill="#fff" opacity="0.7"/>
      <ellipse cx="380" cy="55" rx="50" ry="20" fill="#fff" opacity="0.6"/>
      <ellipse cx="310" cy="70" rx="40" ry="16" fill="#f0f0ff" opacity="0.5"/>
    </g>
  </g>

  <!-- Cloud 2 -->
  <g class="cloud-2" opacity="0.6">
    <g filter="url(#cloudBlur)">
      <ellipse cx="580" cy="105" rx="85" ry="18" fill="#fff" opacity="0.5"/>
      <ellipse cx="630" cy="98" rx="45" ry="17" fill="#fff" opacity="0.4"/>
      <ellipse cx="540" cy="108" rx="35" ry="14" fill="#f5f5ff" opacity="0.3"/>
    </g>
  </g>

  <!-- Cloud 3 -->
  <g class="cloud-3" opacity="0.75">
    <g filter="url(#cloudBlur)">
      <ellipse cx="180" cy="92" rx="60" ry="20" fill="#fff" opacity="0.6"/>
      <ellipse cx="220" cy="82" rx="40" ry="18" fill="#fff" opacity="0.5"/>
    </g>
  </g>

  <!-- ===================== DISTANT MOUNTAINS (far, lighter, larger) ===================== -->
  <path d="M-30,290 L40,195 Q70,170 100,185 L160,155 Q190,135 220,155 L300,140 Q330,125 360,145 
           L440,120 Q470,100 500,125 L570,145 Q600,130 640,140 L710,155 Q740,165 780,175 
           L840,195 Q870,210 920,230 L960,260 L960,300 L-30,300 Z"
        fill="url(#mtnFarGrad)" opacity="0.6"/>

  <!-- Mountain snow caps (far) -->
  <path d="M155,157 Q165,148 175,157 Q165,152 155,157Z" fill="#e0e8f0" opacity="0.5"/>
  <path d="M355,146 Q365,138 375,146 Q365,142 355,146Z" fill="#e0e8f0" opacity="0.4"/>
  <path d="M565,147 Q575,139 585,147 Q575,142 565,147Z" fill="#e0e8f0" opacity="0.3"/>

  <!-- ===================== NEARER MOUNTAINS ===================== -->
  <path d="M-20,310 L30,255 Q65,230 95,248 L170,218 Q205,195 240,218 
           L330,200 Q365,182 400,205 L480,185 Q510,172 540,188 
           L630,205 Q665,218 700,235 L790,255 Q830,265 880,278 
           L960,295 L960,330 L-20,330 Z"
        fill="url(#mtnNearGrad)"/>

  <!-- Snow caps (near) -->
  <path d="M235,219 Q248,207 260,219 Q248,213 235,219Z" fill="#d8e8d0" opacity="0.4"/>
  <path d="M475,186 Q488,176 500,186 Q488,181 475,186Z" fill="#d8e8d0" opacity="0.3"/>

  <!-- ===================== GROUND (grass) ===================== -->
  <path d="M-20,325 Q50,318 120,322 Q200,328 280,324 Q370,319 450,326 
           Q540,332 620,327 Q700,321 780,328 Q850,333 920,330 L960,332 
           L960,560 L-20,560 Z"
        fill="url(#groundGrad)"/>

  <!-- Ground texture - subtle darker patches -->
  <ellipse cx="100" cy="480" rx="80" ry="15" fill="#3a6622" opacity="0.3"/>
  <ellipse cx="500" cy="510" rx="120" ry="18" fill="#3a6622" opacity="0.2"/>
  <ellipse cx="750" cy="490" rx="90" ry="14" fill="#3a6622" opacity="0.25"/>

  <!-- ===================== FOREST (TREES) - BEHIND ROAD ===================== -->
  <!-- Trees are drawn behind the road to create depth -->
  <g id="forest-trees">
    <!-- Tree 1 - left side, tall -->
    <g class="flower-sway" style="animation-duration:3.2s; transform-origin:50px 330px;">
      <rect x="43" y="235" width="14" height="95" rx="4" fill="url(#trunkGrad)"/>
      <ellipse cx="50" cy="230" rx="38" ry="42" fill="#2a6e18"/>
      <ellipse cx="40" cy="210" rx="30" ry="32" fill="#348a24"/>
      <ellipse cx="62" cy="205" rx="28" ry="28" fill="#2e7c1c"/>
      <ellipse cx="50" cy="190" rx="22" ry="24" fill="#3a9430" opacity="0.8"/>
    </g>

    <!-- Tree 2 - left side, smaller -->
    <g class="flower-sway" style="animation-duration:2.8s; transform-origin:85px 330px;">
      <rect x="81" y="260" width="8" height="70" rx="3" fill="#5a3a1e"/>
      <ellipse cx="85" cy="255" rx="24" ry="28" fill="#2d7a20"/>
      <ellipse cx="78" cy="238" rx="18" ry="22" fill="#35982a"/>
      <ellipse cx="92" cy="235" rx="16" ry="19" fill="#2e8622"/>
    </g>

    <!-- Tree 3 - mid-left, tall -->
    <g class="flower-sway" style="animation-duration:3.5s; transform-origin:140px 330px;">
      <rect x="135" y="248" width="10" height="78" rx="3" fill="#6e4e2e"/>
      <ellipse cx="140" cy="240" rx="32" ry="36" fill="#287a18"/>
      <ellipse cx="132" cy="222" rx="24" ry="28" fill="#329022"/>
      <ellipse cx="150" cy="218" rx="22" ry="24" fill="#2a7e1a"/>
    </g>

    <!-- Tree 4 - right side, tall -->
    <g class="flower-sway" style="animation-duration:3.1s; transform-origin:650px 330px;">
      <rect x="644" y="230" width="12" height="98" rx="4" fill="#5a3a1e"/>
      <ellipse cx="650" cy="225" rx="42" ry="46" fill="#2a7818"/>
      <ellipse cx="638" cy="202" rx="32" ry="34" fill="#349626"/>
      <ellipse cx="662" cy="195" rx="28" ry="28" fill="#2e861c"/>
      <ellipse cx="650" cy="178" rx="20" ry="22" fill="#3aa030" opacity="0.7"/>
    </g>

    <!-- Tree 5 - far right -->
    <g class="flower-sway" style="animation-duration:2.9s; transform-origin:750px 330px;">
      <rect x="745" y="258" width="10" height="72" rx="3" fill="#6e4e2e"/>
      <ellipse cx="750" cy="252" rx="30" ry="33" fill="#2d7e1c"/>
      <ellipse cx="740" cy="235" rx="22" ry="26" fill="#35982a"/>
      <ellipse cx="760" cy="232" rx="19" ry="22" fill="#2e8622"/>
    </g>

    <!-- Tree 6 - right side, small -->
    <g class="flower-sway" style="animation-duration:3.4s; transform-origin:820px 330px;">
      <rect x="817" y="275" width="6" height="55" rx="2" fill="#5a3a1e"/>
      <ellipse cx="820" cy="268" rx="18" ry="22" fill="#2a7818"/>
      <ellipse cx="814" cy="254" rx="14" ry="18" fill="#329022"/>
    </g>

    <!-- Tree 7 - far left edge -->
    <g class="flower-sway" style="animation-duration:3.6s; transform-origin:-15px 330px;">
      <rect x="-22" y="268" width="9" height="62" rx="3" fill="#5a3a1e"/>
      <ellipse cx="-17" cy="260" rx="26" ry="28" fill="#2d7a20"/>
      <ellipse cx="-24" cy="245" rx="19" ry="20" fill="#35982a"/>
    </g>

    <!-- Bushes -->
    <ellipse cx="200" cy="328" rx="28" ry="16" fill="#2d7a20"/>
    <ellipse cx="210" cy="324" rx="20" ry="12" fill="#35982a"/>
    <ellipse cx="550" cy="327" rx="24" ry="14" fill="#2d7a20"/>
    <ellipse cx="560" cy="323" rx="16" ry="10" fill="#35982a"/>
    <ellipse cx="500" cy="330" rx="20" ry="12" fill="#2a7818"/>
  </g>

  <!-- ===================== ROAD ===================== -->
  <path d="M-20,378 Q100,374 250,376 Q450,380 650,376 Q800,374 960,378 L960,455 
           Q800,459 650,456 Q450,452 250,456 Q100,460 -20,455 Z"
        fill="url(#roadGrad)" stroke="#555" stroke-width="0.5"/>

  <!-- Road texture -->
  <ellipse cx="200" cy="420" rx="30" ry="3" fill="#666" opacity="0.4"/>
  <ellipse cx="500" cy="418" rx="25" ry="2.5" fill="#666" opacity="0.3"/>
  <ellipse cx="750" cy="422" rx="20" ry="2" fill="#666" opacity="0.35"/>

  <!-- Road edge lines -->
  <line x1="-15" y1="380" x2="955" y2="379" stroke="#888" stroke-width="1.2" opacity="0.4"/>
  <line x1="-15" y1="456" x2="955" y2="455" stroke="#888" stroke-width="1.2" opacity="0.4"/>

  <!-- Road dashes -->
  <g opacity="0.3" stroke="#aaa" stroke-width="1.5">
    <line x1="80" y1="417" x2="110" y2="417.5"/>
    <line x1="160" y1="417" x2="190" y2="417.5"/>
    <line x1="240" y1="418" x2="270" y2="418.5"/>
    <line x1="320" y1="418" x2="350" y2="418.5"/>
    <line x1="400" y1="419" x2="430" y2="419.5"/>
    <line x1="480" y1="418" x2="510" y2="418.5"/>
    <line x1="560" y1="418" x2="590" y2="418.5"/>
    <line x1="640" y1="417" x2="670" y2="417.5"/>
    <line x1="720" y1="417" x2="750" y2="417.5"/>
    <line x1="800" y1="416" x2="830" y2="416.5"/>
    <line x1="880" y1="416" x2="910" y2="416.5"/>
  </g>

  <!-- ===================== GROUND PLANTS & FLOWERS ===================== -->
  <!-- Small flowers on grass -->
  <g class="flower-sway" style="transform-origin:180px 365px; animation-duration:2.5s;">
    <line x1="180" y1="365" x2="180" y2="355" stroke="#2e7a18" stroke-width="1.5"/>
    <circle cx="180" cy="353" r="3" fill="#ff6b9d"/>
